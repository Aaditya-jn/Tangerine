<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body {
  width:520px; height:520px; background:transparent;
  overflow:hidden; font-family:-apple-system,'Segoe UI',sans-serif;
  user-select:none;
}
svg { position:absolute; inset:0; width:520px; height:520px; }
#center {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:96px; height:96px; border-radius:50%;
  background:rgba(18,18,18,0.92);
  border:2px solid rgba(255,255,255,0.12);
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; cursor:pointer;
  box-shadow:0 4px 24px rgba(0,0,0,0.6); pointer-events:all;
  color:#fff; text-align:center; padding:10px;
}
#center .emoji { font-size:20px; }
#center .fname {
  font-size:8px; opacity:0.6; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; max-width:82px;
}
#center .cancel { font-size:10px; opacity:0.5; }

#tooltip {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.8); color:#fff; font-size:10px;
  font-weight:600; padding:5px 12px; border-radius:8px;
  pointer-events:none; opacity:0; transition:opacity 0.15s;
  white-space:nowrap;
}
#tooltip.show { opacity:1; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 520 520">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>
  <g id="segs"></g>
</svg>

<div id="center">
  <div class="emoji">🍊</div>
  <div class="fname" id="fname"></div>
  <div class="cancel">✕ cancel</div>
</div>
<div id="tooltip"></div>

<script>
const CX=260, CY=260, INNER=82, OUTER=228, GAP=2.8;

const COLORS = {
  image:   ['#FF6B35','#FF8040','#FF9A52','#FFB066','#FFC87A','#FFD98E'],
  video:   ['#7C3AED','#8B5CF6','#A78BFA','#C4B5FD','#6D28D9','#5B21B6'],
  audio:   ['#059669','#10B981','#34D399','#6EE7B7','#047857','#065F46'],
  doc:     ['#1D4ED8','#2563EB','#3B82F6','#60A5FA','#93C5FD','#BFDBFE'],
  archive: ['#B45309','#D97706','#F59E0B','#FCD34D'],
  tool:    ['#BE185D','#DB2777','#EC4899','#F472B6','#FBCFE8'],
};

const LABELS = {
  '__compress__':     'Compress image',
  '__resize50__':     'Resize to 50%',
  '__resize25__':     'Resize to 25%',
  '__gray__':         'Grayscale',
  '__rotate90__':     'Rotate 90°',
  '__extractaudio__': 'Extract as MP3',
  '__trim__':         'Trim first 30s',
  '__pdf2img__':      'Pages → PNG',
  '__pdf2img_jpg__':  'Pages → JPG',
  '__pdf2docx__':     'Convert to Word',
  '__pdf2txt__':      'Extract text',
  '__pdfcompress__':  'Compress PDF',
  '__pdfmerge__':     'Merge PDFs',
  '__pdfsplit__':     'Split pages',
  '__extract__':      'Extract here',
  '__repack_zip__':   'Repack → ZIP',
  '__repack_targz__': 'Repack → TAR.GZ',
  '__repack_7z__':    'Repack → 7Z',
};

function polar(cx,cy,r,deg) {
  const rad = (deg-90)*Math.PI/180;
  return { x: cx+r*Math.cos(rad), y: cy+r*Math.sin(rad) };
}

function arc(cx,cy,ri,ro,s,e) {
  const p1=polar(cx,cy,ro,s), p2=polar(cx,cy,ro,e);
  const p3=polar(cx,cy,ri,e), p4=polar(cx,cy,ri,s);
  const lg=(e-s)>180?1:0;
  return `M${p1.x} ${p1.y} A${ro} ${ro} 0 ${lg} 1 ${p2.x} ${p2.y}
          L${p3.x} ${p3.y} A${ri} ${ri} 0 ${lg} 0 ${p4.x} ${p4.y} Z`;
}

function lighten(hex, amt=0.25) {
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const m=c=>Math.min(255,Math.round(c+(255-c)*amt)).toString(16).padStart(2,'0');
  return '#'+m(r)+m(g)+m(b);
}

let filePath='', options=[];
const tooltip = document.getElementById('tooltip');

function render() {
  const n=options.length; if(!n) return;
  const sweep=(360/n)-GAP;
  const g=document.getElementById('segs');
  g.innerHTML='';

  options.forEach((opt,i) => {
    const s = i*(360/n)+GAP/2;
    const e = s+sweep;
    const mid = s+sweep/2;
    const pal  = COLORS[opt.group] || COLORS.tool;
    const fill = pal[i%pal.length];
    const d    = arc(CX,CY,INNER,OUTER,s,e);

    const seg = document.createElementNS('http://www.w3.org/2000/svg','g');

    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);
    p.setAttribute('fill',fill);
    p.setAttribute('stroke','rgba(0,0,0,0.2)');
    p.setAttribute('stroke-width','1');
    p.style.filter='url(#shadow)';
    p.style.cursor='pointer';

    const lr = (INNER+OUTER)/2;
    const lp = polar(CX,CY,lr,mid);
    const displayLabel = LABELS[opt.value] || opt.label;
    const shortLabel   = opt.label;

    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',lp.x); t.setAttribute('y',lp.y+4);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('fill','#fff');
    t.setAttribute('font-size', n>16?'8.5':n>12?'9.5':'11');
    t.setAttribute('font-weight','700');
    t.setAttribute('font-family','-apple-system,Segoe UI,sans-serif');
    t.setAttribute('pointer-events','none');
    t.textContent = shortLabel;

    seg.appendChild(p); seg.appendChild(t);

    seg.addEventListener('mouseenter', () => {
      p.setAttribute('fill', lighten(fill));
      tooltip.textContent = displayLabel;
      tooltip.classList.add('show');
    });
    seg.addEventListener('mouseleave', () => {
      p.setAttribute('fill', fill);
      tooltip.classList.remove('show');
    });
    seg.addEventListener('click', () => {
      window.api.sendConvert(filePath, opt.value);
    });

    g.appendChild(seg);
  });

  document.getElementById('fname').textContent = filePath.split('/').pop();
}

window.api.onInitRadial(({ filePath:fp, options:opts }) => {
  filePath=fp; options=opts; render();
});

document.getElementById('center').addEventListener('click', () => window.api.sendCloseRadial());
</script>
</body>
</html>
