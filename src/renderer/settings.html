<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,'Segoe UI',sans-serif;
  background:#1a1a1a; color:#e8e8e8;
  padding:24px; font-size:13px; line-height:1.5;
}
h1 { font-size:18px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
h1 span { font-size:22px; }

.section { margin-bottom:22px; }
.section-title {
  font-size:10px; font-weight:700; letter-spacing:1.2px;
  color:#FF9A3C; text-transform:uppercase; margin-bottom:10px;
  border-bottom:1px solid rgba(255,154,60,0.2); padding-bottom:5px;
}

.row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
label { font-size:12px; color:#ccc; }

input[type=text] {
  background:#2a2a2a; border:1px solid #444; border-radius:6px;
  color:#eee; padding:5px 8px; font-size:11px; width:160px; outline:none;
}
input[type=text]:focus { border-color:#FF9A3C; }

.btn {
  background:#333; border:1px solid #555; border-radius:6px;
  color:#ddd; padding:5px 10px; font-size:11px; cursor:pointer;
  transition:background 0.15s;
}
.btn:hover { background:#FF6B00; border-color:#FF6B00; color:#fff; }

input[type=range] {
  -webkit-appearance:none; width:120px; height:4px;
  background:#444; border-radius:2px; outline:none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px;
  background:#FF6B00; border-radius:50%; cursor:pointer;
}
#quality-val { font-size:11px; color:#FF9A3C; font-weight:700; width:28px; text-align:right; }

/* Toggle */
.toggle { position:relative; width:38px; height:20px; cursor:pointer; }
.toggle input { opacity:0; width:0; height:0; }
.slider-t {
  position:absolute; inset:0; background:#444; border-radius:20px;
  transition:background 0.2s;
}
.slider-t::before {
  content:''; position:absolute; width:14px; height:14px;
  left:3px; top:3px; background:#fff; border-radius:50%;
  transition:transform 0.2s;
}
.toggle input:checked + .slider-t { background:#FF6B00; }
.toggle input:checked + .slider-t::before { transform:translateX(18px); }

/* Theme radio */
.theme-group { display:flex; gap:8px; }
.theme-opt {
  padding:4px 10px; border-radius:6px; border:1px solid #444;
  font-size:11px; cursor:pointer; color:#ccc; background:#2a2a2a;
  transition:all 0.15s;
}
.theme-opt.active { border-color:#FF6B00; color:#FF9A3C; background:rgba(255,107,0,0.1); }

/* Radial color pickers */
.color-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.color-row label { font-size:11px; color:#ccc; }
input[type=color] {
  width:30px; height:22px; border:1px solid #444; border-radius:5px;
  background:none; padding:0; cursor:pointer;
}
#reset-theme-btn { font-size:10px; color:#888; background:none; border:none; cursor:pointer; text-decoration:underline; }
#reset-theme-btn:hover { color:#FF9A3C; }

/* Save btn */
#save-btn {
  width:100%; padding:10px; background:linear-gradient(135deg,#FF6B00,#FF9A3C);
  border:none; border-radius:10px; color:#fff; font-size:14px;
  font-weight:700; cursor:pointer; margin-top:10px; transition:opacity 0.15s;
}
#save-btn:hover { opacity:0.9; }
#saved-msg { text-align:center; font-size:11px; color:#10B981; margin-top:8px; opacity:0; transition:opacity 0.3s; }
#saved-msg.show { opacity:1; }
</style>
</head>
<body>
<h1><span>🍊</span> Tangerine Settings</h1>

<div class="section">
  <div class="section-title">Output</div>
  <div class="row">
    <label>Save to folder</label>
    <div style="display:flex;gap:6px">
      <input type="text" id="output-folder" readonly>
      <button class="btn" id="browse-btn">Browse</button>
    </div>
  </div>
  <div class="row">
    <label>Auto-open after convert</label>
    <label class="toggle">
      <input type="checkbox" id="auto-open">
      <span class="slider-t"></span>
    </label>
  </div>
</div>

<div class="section">
  <div class="section-title">Image Quality (Compress)</div>
  <div class="row">
    <label>Quality</label>
    <div style="display:flex;align-items:center;gap:8px">
      <input type="range" id="quality" min="10" max="100" value="75">
      <span id="quality-val">75</span>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Appearance</div>
  <div class="row">
    <label>Theme</label>
    <div class="theme-group" id="theme-group">
      <div class="theme-opt active" data-val="auto">Auto</div>
      <div class="theme-opt" data-val="light">Light</div>
      <div class="theme-opt" data-val="dark">Dark</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Radial Menu Colors</div>
  <div class="color-row"><label>Images</label><input type="color" id="rc-image"></div>
  <div class="color-row"><label>Video</label><input type="color" id="rc-video"></div>
  <div class="color-row"><label>Audio</label><input type="color" id="rc-audio"></div>
  <div class="color-row"><label>Documents</label><input type="color" id="rc-doc"></div>
  <div class="color-row"><label>Archives</label><input type="color" id="rc-archive"></div>
  <div class="color-row"><label>Tools</label><input type="color" id="rc-tool"></div>
  <div class="color-row"><label>Center button</label><input type="color" id="rc-centerBg"></div>
  <div class="row" style="margin-top:6px"><span></span><button id="reset-theme-btn">Reset to default colors</button></div>
</div>

<button id="save-btn">Save Settings</button>
<div id="saved-msg">✓ Settings saved!</div>

<script>
let cfg = {};

const DEFAULT_RADIAL_THEME = {
  image: '#FF6B35', video: '#7C3AED', audio: '#059669',
  doc: '#1D4ED8', archive: '#B45309', tool: '#BE185D', centerBg: '#121212',
};

function applyRadialTheme(t) {
  Object.keys(DEFAULT_RADIAL_THEME).forEach(key => {
    document.getElementById('rc-' + key).value = t[key] || DEFAULT_RADIAL_THEME[key];
  });
}

async function init() {
  cfg = await window.api.getSettings();
  document.getElementById('output-folder').value = cfg.outputFolder || '';
  document.getElementById('auto-open').checked   = !!cfg.autoOpen;
  document.getElementById('quality').value        = cfg.imageQuality || 75;
  document.getElementById('quality-val').textContent = cfg.imageQuality || 75;
  setTheme(cfg.theme || 'auto');
  applyRadialTheme({ ...DEFAULT_RADIAL_THEME, ...(cfg.radialTheme || {}) });
}

document.getElementById('reset-theme-btn').addEventListener('click', () => applyRadialTheme(DEFAULT_RADIAL_THEME));

document.getElementById('quality').addEventListener('input', e => {
  document.getElementById('quality-val').textContent = e.target.value;
});

document.getElementById('browse-btn').addEventListener('click', async () => {
  const folder = await window.api.pickFolder();
  if (folder) document.getElementById('output-folder').value = folder;
});

document.querySelectorAll('.theme-opt').forEach(el => {
  el.addEventListener('click', () => setTheme(el.dataset.val));
});

function setTheme(val) {
  document.querySelectorAll('.theme-opt').forEach(e => e.classList.toggle('active', e.dataset.val===val));
}

function getActiveTheme() {
  return document.querySelector('.theme-opt.active')?.dataset.val || 'auto';
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const newCfg = {
    outputFolder: document.getElementById('output-folder').value,
    autoOpen:     document.getElementById('auto-open').checked,
    imageQuality: parseInt(document.getElementById('quality').value),
    theme:        getActiveTheme(),
    radialTheme:  Object.fromEntries(
      Object.keys(DEFAULT_RADIAL_THEME).map(key => [key, document.getElementById('rc-' + key).value])
    ),
  };
  await window.api.saveSettings(newCfg);
  const msg = document.getElementById('saved-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
});

init();
</script>
</body>
</html>
